name: lan-shui-jing-blog

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/01-init_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: blog-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 50s

  user-blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user-blog
    image: lan-shui-jing/user-blog:latest
    container_name: blog-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_ENABLED: "false"
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blog_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-lsj-blog-secret-key-2024-must-be-at-least-256-bits-long-for-hs256}

  article-blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: article-blog
    image: lan-shui-jing/article-blog:latest
    container_name: blog-article
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_ENABLED: "false"
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blog_article?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}

  ai-blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ai-blog
    image: lan-shui-jing/ai-blog:latest
    container_name: blog-ai
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_ENABLED: "false"
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blog_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  gateway-blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway-blog
    image: lan-shui-jing/gateway-blog:latest
    container_name: blog-gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      user-blog:
        condition: service_started
      article-blog:
        condition: service_started
      ai-blog:
        condition: service_started
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_ENABLED: "false"
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-lsj-blog-secret-key-2024-must-be-at-least-256-bits-long-for-hs256}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  redis-data:
